version: "2"

run:
  timeout: 3m

linters:
  default: standard   # errcheck, govet, ineffassign, staticcheck, unused
  settings:
    errcheck:
      exclude-functions:
        - (*github.com/gin-gonic/gin.Context).Error   # returns the attached *gin.Error; discarding it is the intended use
  exclusions:
    paths:
      - internal/db   # sqlc-generated
    generated: lax

formatters:
  enable:
    - gofmt
  exclusions:
    paths:
      - internal/db
