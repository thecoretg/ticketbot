# CI runs the same checks as .claude/skills/verify, then asks Easypanel to build. Easypanel builds
# the Dockerfile from the branch it watches (v2-main now, main at cutover), so the deploy job is
# the gate: a red check never reaches the deploy URL.
name: CI

on:
  push:
    branches: ["**"]
  pull_request:

permissions:
  contents: read

env:
  TEST_DB_DSN: postgres://testuser:testpass@localhost:5433/testdb?sslmode=disable

jobs:
  check:
    name: Build, lint and test
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: testuser
          POSTGRES_PASSWORD: testpass
          POSTGRES_DB: testdb
        ports: ["5433:5432"]
        options: >-
          --health-cmd "pg_isready -U testuser -d testdb"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: gofmt
        run: |
          out=$(gofmt -l $(git ls-files '*.go' | grep -v '^internal/db/'))
          if [ -n "$out" ]; then echo "unformatted:"; echo "$out"; exit 1; fi

      - name: Build and vet
        run: go build ./... && go vet ./...

      - name: golangci-lint
        uses: golangci/golangci-lint-action@v8
        with:
          version: v2.13.0

      - uses: sqlc-dev/setup-sqlc@v4
        with:
          sqlc-version: "1.31.1"

      - name: sqlc is current
        run: |
          sqlc generate
          git diff --exit-code -- internal/db || { echo "internal/db is stale: run make gensql"; exit 1; }

      - name: Unit tests
        run: go test ./...

      - name: Migrate the test database
        run: go run github.com/pressly/goose/v3/cmd/goose@v3.26.0 -dir migrations postgres "$TEST_DB_DSN" up

      - name: Postgres tests
        run: TEST_POSTGRES_DSN="$TEST_DB_DSN" go test ./internal/postgres/

      - name: Dashboard scripts parse
        run: for f in internal/web/static/*.js; do node --check "$f"; done

      - name: Docker image builds
        run: docker build --build-arg VERSION=ci .

  deploy:
    name: Trigger Easypanel build
    needs: check
    # The watched branch. Change to refs/heads/main at cutover, together with Easypanel's setting.
    if: github.event_name == 'push' && github.ref == 'refs/heads/v2-main'
    runs-on: ubuntu-latest
    steps:
      - name: Call the Easypanel deploy URL
        env:
          EASYPANEL_DEPLOY_URL: ${{ secrets.EASYPANEL_DEPLOY_URL }}
        run: |
          if [ -z "$EASYPANEL_DEPLOY_URL" ]; then echo "EASYPANEL_DEPLOY_URL secret is not set"; exit 1; fi
          curl --fail --silent --show-error -X POST "$EASYPANEL_DEPLOY_URL"
