# Local stack. The app reads its env from the repo-root .env (a 1Password-mounted file works).
# The db service needs no env file: it uses the DB_* defaults below unless you override them.
services:
  db:
    image: postgres:16
    container_name: ticketbot-postgres
    environment:
      POSTGRES_USER: ${DB_USER:-testuser}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-testpass}
      POSTGRES_DB: ${DB_NAME:-testdb}
    ports:
      - "${DB_PORT:-5433}:5432"
    volumes:
      - db_data:/var/lib/postgresql/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-testuser} -d ${DB_NAME:-testdb}"]
      interval: 2s
      timeout: 2s
      retries: 10

  app:
    build:
      context: ..
      dockerfile: docker/DockerfileMain
      args:
        VERSION: ${VERSION:-dev}
    container_name: ticketbot
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "${PORT:-8080}:8080"
    restart: unless-stopped
    env_file: ../.env
    environment:
      # inside the compose network the app must reach the db service, not localhost
      POSTGRES_DSN: "postgres://${DB_USER:-testuser}:${DB_PASSWORD:-testpass}@db:5432/${DB_NAME:-testdb}?sslmode=disable"

volumes:
  db_data:
